name: Build, Scan & Deploy (GitHub Actions)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Hardened Docker Image
        run: |
          docker build -t karaoke-live:latest .

  scan:
    name: Trivy Security Scan
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Image for Scanning
        run: |
          docker build -t karaoke-live:latest .

      - name: Run Aqua Security Trivy Action
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'karaoke-live:latest'
          format: 'table'
          severity: 'HIGH,CRITICAL'
          exit-code: '0'

      - name: Enforce Zero CRITICAL Vulnerabilities Policy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'karaoke-live:latest'
          format: 'table'
          severity: 'CRITICAL'
          exit-code: '1'

  deploy:
    name: Automated Zero-Downtime Deployment
    needs: [build, scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to Oracle VPS via SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          SSH_HOST: ${{ secrets.VPS_SSH_HOST || '158.178.214.207' }}
          SSH_USER: ${{ secrets.VPS_SSH_USER || 'ubuntu' }}
        run: |
          if [ -n "$SSH_KEY" ]; then
            echo "Connecting to Oracle VPS at $SSH_HOST..."
            mkdir -p ~/.ssh
            echo "$SSH_KEY" > ~/.ssh/deploy_key
            chmod 600 ~/.ssh/deploy_key
            ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key "${SSH_USER}@${SSH_HOST}" '
              set -e
              cd /home/ubuntu/karaoke-live
              git pull origin main || git pull github main || true
              docker compose up -d --build --remove-orphans
              
              echo "Awaiting healthy container status..."
              for i in $(seq 1 12); do
                HEALTH=$(docker inspect --format="{{json .State.Health.Status}}" karaoke-live 2>/dev/null || echo "\"starting\"")
                echo "Probe $i/12: Health status is $HEALTH"
                if [ "$HEALTH" = "\"healthy\"" ]; then
                  echo "✅ karaoke-live container is healthy and responding!"
                  exit 0
                fi
                sleep 5
              done
              echo "❌ Healthcheck failed"
              docker logs --tail 50 karaoke-live
              exit 1
            '
          else
            echo "::notice ::VPS_SSH_KEY secret is not set. Deployment skipped for GitHub Actions (managed on-cluster by Gitea Actions)."
          fi
